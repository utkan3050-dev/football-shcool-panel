<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Değiştir | Futbol Okulu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
    <div>
        <h2>⚽ {{ session.school_name or "Futbol Okulu Paneli" }}</h2>
    </div>

    <div class="top-actions">
        <a href="{{ url_for('dashboard') }}" class="btn">
            Ana Sayfa
        </a>

        <a href="{{ url_for('logout') }}" class="btn danger">
            Çıkış
        </a>
    </div>
</header>

<main class="container small-container">

    <div class="page-title">
        <div>
            <h1>🔑 Şifre Değiştir</h1>
            <p>Hesabınızın giriş şifresini buradan değiştirebilirsiniz.</p>
        </div>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <section class="form-card">

        <form method="POST">

            <div class="form-grid">

                <div class="form-group full-width">
                    <label>Mevcut Şifre *</label>
                    <input
                        type="password"
                        name="current_password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Yeni Şifre *</label>
                    <input
                        type="password"
                        name="new_password"
                        minlength="4"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Yeni Şifre Tekrar *</label>
                    <input
                        type="password"
                        name="confirm_password"
                        minlength="4"
                        autocomplete="new-password"
                        required
                    >
                </div>

            </div>

            <div class="form-actions">
                <a href="{{ url_for('dashboard') }}" class="btn">
                    İptal
                </a>

                <button type="submit" class="btn primary">
                    Şifreyi Değiştir
                </button>
            </div>

        </form>

    </section>

</main>

</body>
</html>
