<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Düzenle | Futbol Okulu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <h2>⚽ Futbol Okulu Paneli</h2>
    <div class="top-actions">
        <a href="{{ url_for('dashboard') }}" class="btn">Ana Sayfa</a>
        <a href="{{ url_for('students') }}" class="btn">Öğrenciler</a>
    </div>
</header>
<main class="container small-container">
    <div class="page-title"><div><h1>Öğrenci Düzenle</h1><p>{{ student.name }} bilgilerini güncelle.</p></div></div>
    <section class="form-card">
        <form method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>Öğrenci Adı Soyadı *</label>
                    <input type="text" name="name" value="{{ student.name }}" required>
                </div>
                <div class="form-group">
                    <label>Doğum Yılı *</label>
                    <input type="number" name="birth_year" value="{{ student.birth_year }}" required>
                </div>
                <div class="form-group">
                    <label>Sınıf / Grup</label>
                    <input type="text" name="class_group" value="{{ student.class_group or '' }}" placeholder="Örn: Cumartesi 11:00">
                </div>
                <div class="form-group">
                    <label>Veli Adı Soyadı</label>
                    <input type="text" name="parent_name" value="{{ student.parent_name or '' }}">
                </div>
                <div class="form-group">
                    <label>Telefon</label>
                    <input type="text" name="phone" value="{{ student.phone or '' }}">
                </div>
                {% if finance_visible %}
                <div class="form-group">
                    <label>Aylık Aidat (TL)</label>
                    <input
                        type="number"
                        name="monthly_fee"
                        min="0"
                        step="0.01"
                        value="{{ student.monthly_fee }}">
                </div>
                {% endif %}
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="active" {% if student.active %}checked{% endif %}> Öğrenci aktif
                    </label>
                </div>
                <div class="form-group full-width">
                    <label>Not</label>
                    <textarea name="notes" rows="4">{{ student.notes or '' }}</textarea>
                </div>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('students') }}" class="btn">İptal</a>
                <button type="submit" class="btn primary">Değişiklikleri Kaydet</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
